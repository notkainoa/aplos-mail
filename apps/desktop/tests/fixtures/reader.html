<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Aplos reader acceptance</title><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="root"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import '/src/renderer/legacy/styles.css';
const image=color=>btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="72" height="36"><rect width="72" height="36" fill="${color}"/></svg>`);
window.readerProbe={calls:[],fail:false};
window.aplos={subscribe:()=>()=>{},invoke:async(method,payload)=>{
  if(method!=='attachment.get')throw new Error('Unexpected fixture action: '+method);
  window.readerProbe.calls.push(payload.attachmentId);
  await new Promise(resolve=>setTimeout(resolve,50));
  if(window.readerProbe.fail)throw new Error('Synthetic inline download failed.');
  return {id:payload.attachmentId,name:'inline.svg',type:'image/svg+xml',size:130,data:image(payload.attachmentId==='first-image'?'#406b55':'#a47760')};
}};
const [{Reader},{prepareMessageBody},{defaultSettings}]=await Promise.all([import('/src/renderer/legacy/Reader.tsx'),import('/src/renderer/legacy/mailBody.ts'),import('/src/main/demo.ts')]);
const makeMessage=(id,attachmentId)=>({id,from:'synthetic@example.test',fromName:'Synthetic Sender',to:['reader@example.test'],date:'2026-10-14T18:00:00Z',text:'Fresh authored content. Older history.',html:'<p>Fresh authored content.</p><img alt="Inline illustration" src="cid:shared-image"><img alt="Remote illustration" src="https://tracking.example.test/pixel"><div class="gmail_quote"><p>Older quoted history.</p><blockquote><p>Nested older history.</p></blockquote></div><script>window.readerProbe.scriptExecuted=true;<\/script>',attachments:[{id:attachmentId,name:'inline.svg',type:'image/svg+xml',size:130,contentId:'shared-image',gmailAttachmentId:attachmentId,messageId:id}]});
const messages=[makeMessage('first','first-image'),makeMessage('latest','latest-image')];
const base={id:'reader-fixture',accountId:'fixture',subject:'Reader fidelity acceptance',summary:'Original synthetic MIME content.',messages,date:messages[1].date,unread:false,status:'new',importance:'important',bookmarked:false,replyStatus:'none'};
function Fixture(){const [status,setStatus]=React.useState(new URLSearchParams(location.search).has('spam')?'spam':'new');const [key,setKey]=React.useState(0);return React.createElement('div',{style:{height:'100vh',display:'flex',flexDirection:'column'}},React.createElement('div',{style:{padding:12,display:'flex',gap:12}},React.createElement('button',{onClick:()=>setStatus('spam')},'Fixture: Spam'),React.createElement('button',{onClick:()=>setStatus('new')},'Fixture: Restore'),React.createElement('button',{onClick:()=>{window.readerProbe.calls=[];window.readerProbe.fail=true;setKey(value=>value+1);}},'Fixture: Retry failure'),React.createElement('button',{onClick:()=>{window.readerProbe.fail=false;}},'Fixture: Allow download')),React.createElement(Reader,{key,thread:{...base,status},settings:defaultSettings,index:0,total:1,back:()=>{},patch:async()=>{},triage:()=>{},talk:()=>{},reply:()=>{},editEvent:()=>{},notify:()=>{},undo:()=>{}}));}
createRoot(document.getElementById('root')).render(React.createElement(Fixture));
window.readerBodyChecks=()=>{
 const check=(condition,message)=>{if(!condition)throw new Error(message);};
 const opts={remote:false,spam:false,inline:{}};
 const fresh=prepareMessageBody(messages[0],opts);
 check(fresh.body.includes('Fresh authored content.'),'Authored content missing');
 check(!fresh.body.includes('Older quoted history.')&&fresh.quoted.includes('Older quoted history.'),'Gmail quote not separated');
 check((fresh.quoted.match(/Nested older history/g)||[]).length===1,'Nested quotes duplicated');
 check(!fresh.body.includes('src="https:')&&!fresh.body.includes('<script'),'Remote acquisition or script survived');
 const plain=prepareMessageBody({...messages[0],html:undefined,text:'Keep <person@example.test> literal.\nOn Wednesday, Pat wrote:\n> Old note'},opts);
 check(plain.body.includes('&lt;person@example.test&gt;')&&!plain.body.includes('Old note')&&plain.quoted.includes('Old note'),'Plain text or quoted boundary lost');
 const spam=prepareMessageBody({...messages[0],html:'<img src="data:image/png;base64,AA=="><img src="https://tracking.example.test/pixel">'},{...opts,remote:true,spam:true});
 check(!spam.body.includes('src='),'Spam loaded an image');
 const outlook=prepareMessageBody({...messages[0],html:'<p>New text</p><div id="divRplyFwdMsg">From: Earlier sender</div><p>Earlier note</p>'},opts);
 check(outlook.body.includes('New text')&&!outlook.body.includes('Earlier note')&&outlook.quoted.includes('Earlier note'),'Outlook history not separated');
 return {checks:7,passed:true};
};
</script></body></html>
