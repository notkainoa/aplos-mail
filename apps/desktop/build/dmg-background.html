<!doctype html>
<!-- The DMG window background. Rendered to background.png and background@2x.png by scripts/build-dmg-background.cjs.
     Finder draws the icons and labels on top; their centers are set in package.json build.dmg.contents. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;width:800px;height:392px;overflow:hidden}
  /* Finder counts its 32pt title bar in the window height, so the canvas is 32pt taller than the visible 800×360 and the bottom strip is never seen. */
  /* The app's light shell grey, flat, with the logo's green for the arrows and grey text for the line. */
  body{position:relative;background:#f5f5f6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased}
  h1{position:absolute;top:44px;left:0;right:0;margin:0;text-align:center;font-size:21px;font-weight:400;letter-spacing:-.01em;color:#63666c}
  h1 b{font-weight:600;color:#1d1e21}
  .arrows{position:absolute;left:400px;top:190px;transform:translate(-50%,-50%);display:flex;gap:2px}
  .arrows svg{width:20px;height:30px}
</style>
</head>
<body>
  <h1>To install, drag <b>Aplos Mail</b> to <b>Applications</b></h1>
  <div class="arrows">
    <svg viewBox="0 0 20 30"><path d="M5 5l10 10-10 10" fill="none" stroke="#075244" stroke-opacity=".25" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg viewBox="0 0 20 30"><path d="M5 5l10 10-10 10" fill="none" stroke="#075244" stroke-opacity=".55" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg viewBox="0 0 20 30"><path d="M5 5l10 10-10 10" fill="none" stroke="#075244" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</body>
</html>
