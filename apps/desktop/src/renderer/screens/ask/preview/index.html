<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aplos Ask and Today preview</title>
<style>
  /* Development-only gallery. The window size (1440 × 900) is the harness's, not a design token, so it lives here
     and nowhere in the app's CSS. The shell around the pane is drawn plainly: ui-shell owns the real one. */
  html, body { margin: 0; }
  .prev-window { position: relative; display: flex; width: 1440px; height: 900px; overflow: hidden; background: var(--shell); contain: layout paint; }
  .prev-window[data-narrow] { width: 1100px; height: 760px; }
  .prev-sidebar { flex: none; width: var(--sidebar-w); }
  .prev-panes { display: flex; flex: 1; gap: var(--shell-pad); min-width: 0; padding: var(--shell-pad); padding-left: 0; }
  .prev-pane { flex: 1; min-width: 0; overflow: auto; border-radius: var(--radius-lg); background: var(--canvas); box-shadow: var(--elev-pane); }
  .prev-index { padding: 24px 32px; font: var(--type-ui); color: var(--ink); }
  .prev-index li { margin: 4px 0; }
  .prev-index a { color: var(--accent); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./main.tsx"></script>
</body>
</html>
