name: Release

# Pushing a tag vX.Y.Z (scripts/release.mjs creates one) builds the macOS artifacts and
# publishes them to a draft GitHub Release for the owner to review. See RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: macOS (arm64 + x64)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The job's write token would otherwise stay in .git/config for every later step, including the
          # build and the app launches. Nothing here uses git credentials; the upload step reads GH_TOKEN.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match apps/desktop/package.json ($version). Cut releases with npm run release."
            exit 1
          fi
      - run: npm ci
      # Electron downloads its binary on first use, not at install; the notices step of every build below
      # copies LICENSES.chromium.html out of node_modules/electron/dist and fails without it.
      - run: node node_modules/electron/install.js
      - run: npm run typecheck -w @aplos/desktop -w @aplos/engine -w @aplos/contract
      - run: npm test -w @aplos/desktop -w @aplos/engine
      - name: Check the new engine on a packaged test build
        # verify:release:real drives a packaged app over --remote-debugging-port with the demo mail in a
        # throwaway data folder (APLOS_TEST=1: no window is shown, no account is added, nothing is sent). A
        # release build refuses that switch (the ADR 40-6 debug guard), so this runs on a separate
        # `npm run package` build in its own folder, before the release build, with no secrets in its environment.
        run: |
          npm run package -w @aplos/desktop -- -c.directories.output=release-check
          npm run verify:release:real -- "$PWD/apps/desktop/release-check/mac-arm64/Aplos Mail.app"
      - name: Build, sign and notarize (nothing is uploaded yet)
        # Missing secrets arrive as empty strings; release-build.mjs then makes an ad-hoc signed,
        # un-notarized build instead of failing. Signing needs CSC_LINK + CSC_KEY_PASSWORD;
        # notarization additionally needs all three APPLE_* secrets. GOOGLE_CLIENT_ID/SECRET and
        # MICROSOFT_CLIENT_ID are inlined into the app so downloads can sign in without a .env;
        # the build fails without the Google pair (APLOS_ALLOW_NO_GOOGLE=1 overrides). Microsoft is optional.
        # `--expect release` makes release-build.mjs verify both apps as a signed, notarized release (including
        # the debug-guard launches), so a run without the signing secrets ends red here. electron-builder runs
        # with --publish never, so this step has no GH_TOKEN.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run release:build -w @aplos/desktop -- --expect release
      - name: Verify hardening of both apps as a release
        # Plan 40 Q2 item 7: fuses, LSMinimumSystemVersion 13.0, codesign, Gatekeeper, stapling, entitlements,
        # the Developer ID designated requirement, a secret scan of the app and the ADR 40-6 debug guard
        # (--launch-checks=guard: --remote-debugging-port and --inspect must make the app exit with code 78).
        # It requires both apps, and it needs no secrets.
        run: |
          status=0
          for app in "apps/desktop/release/mac-arm64/Aplos Mail.app" "apps/desktop/release/mac/Aplos Mail.app"; do
            if [ ! -d "$app" ]; then
              echo "::error::$app was not built."
              status=1
            elif ! node apps/desktop/scripts/verify-hardening.mjs "$app" --expect release --launch-checks=guard; then
              echo "::error::verify-hardening failed for $app."
              status=1
            fi
          done
          exit $status
      - name: Upload to the draft release (only after verification passed)
        # release-build.mjs verifies both apps as a release once more (static rows) before uploading anything.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node apps/desktop/scripts/release-build.mjs --upload-only --publish always
      - name: Keep the artifacts with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aplos-mail-${{ github.ref_name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
