name: CI

# Free-minutes rule: Linux jobs run on pushes to revamp only; there is no pull_request trigger
# (the Integrator runs the full suite before each merge). macOS runs only when a manual run
# ticks the "macos" box, so a scratch-branch proof of the static job costs Linux minutes only.
on:
  push:
    branches: [revamp]
  workflow_dispatch:
    inputs:
      macos:
        description: Also run the desktop job on macOS (costs about 10x Linux minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'push'
        with:
          # On a push to revamp, compare with the commit before the push.
          base: ${{ github.ref_name }}
          filters: |
            shared: &shared
              - package.json
              - package-lock.json
              - .node-version
              - packages/**
              - .github/workflows/ci.yml
            desktop:
              - *shared
              - apps/desktop/**
              - scripts/**
            web:
              - *shared
              - apps/web/**

  static:
    name: Static (format, lint, types, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      # --ignore-scripts: no Electron binary download and no git-hook install on the runner.
      - run: npm ci --ignore-scripts
      # Checks other lanes add later print "pending: <name>" until their script exists.
      - run: node scripts/audit/run-if-present.mjs format:check
      - run: npm run lint
      - run: npm run test:lint
      - run: npm run test:audit
      - run: npm run lint:css
      # The change check (a PR against revamp) runs locally in npm run check and in the integrator's merge procedure;
      # a push to revamp has nothing to compare, so CI validates OWNERS.md itself.
      - run: node scripts/audit/owners-check.mjs --validate
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      # Runs under system Node. The suites that touch node:sqlite (store, service, queue,
      # sync-safety, sql) move under Electron's own Node in Q3, because node:sqlite uses the
      # SQLite of the host runtime and the two differ.
      - run: npm test

  web:
    name: Website (typecheck, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck -w @aplos/web
      - run: npm run build -w @aplos/web

  # macOS minutes are scarce: this job runs only when started by hand with the macos box ticked.
  desktop-macos:
    name: Desktop on macOS (typecheck, test, build)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Renderer (Vite), main/engine bundles (esbuild) and the native helper (swiftc).
      - run: npm run build -w @aplos/desktop

  slots:
    name: slots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: summary heading
        run: echo '### Pending slots (listed when the owning lane has not landed its script)' >> "$GITHUB_STEP_SUMMARY"
      # The slots run in sequence; a failing slot does not hide the ones after it.
      - name: slot check:openapi
        run: node scripts/audit/slot.mjs check:openapi
      - name: slot check:tokens
        if: ${{ !cancelled() }}
        run: node scripts/audit/slot.mjs check:tokens
      - name: slot check:contrast
        if: ${{ !cancelled() }}
        run: node scripts/audit/slot.mjs check:contrast
      - name: slot check:identity
        if: ${{ !cancelled() }}
        run: node scripts/audit/slot.mjs check:identity
      - name: slot test:visual
        if: ${{ !cancelled() }}
        run: node scripts/audit/slot.mjs test:visual
      - name: budget register
        if: ${{ !cancelled() }}
        run: npm run check:budgets
