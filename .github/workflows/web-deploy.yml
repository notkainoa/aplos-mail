# Deploys apps/web (static site) to Cloudflare Pages.
#   pull request touching the site -> preview deployment, URL posted on the PR
#   push to main touching the site -> production deployment
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and a Pages project (see apps/web/README.md).
# Without the secrets the job passes and does nothing, so forks and fresh clones stay green.
name: Website

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'aplos-mail' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PRs from forks cannot read secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Cloudflare secrets are not set; skipping deploy."; fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      # Only the site's dependencies; the desktop workspace (Electron) is not needed.
      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: npm ci --workspace @aplos/web --include-workspace-root
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build
        if: steps.creds.outputs.ready == 'true'
        run: npm run web:build

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # main is the production branch of the Pages project; any other branch gets a preview.
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || 'manual deploy' }}
        run: |
          npx --yes wrangler@4 pages deploy apps/web/dist \
            --project-name "$PAGES_PROJECT" \
            --branch "$BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$(printf '%s' "$COMMIT_MESSAGE" | head -n1 | cut -c1-100)" | tee deploy.log
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' deploy.log | tail -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Website deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the PR
        if: steps.deploy.outputs.url != '' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- aplos-web-preview -->'
          body="$marker
          **Website preview:** $URL

          Built from \`${GITHUB_SHA::7}\`. Updated on every push that touches the site."
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
