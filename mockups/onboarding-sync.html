<!doctype html>
<html lang="en" data-window="onboarding" data-states="progress,paused,ready,partial,failed" data-esc="home.html">
<head>
<meta charset="utf-8">
<title>Onboarding · Getting your mail · Aplos mockup</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shell.css">
<script src="shell.js"></script>
<style>
  /* INVENTED: the dawn glow of sky moment 2. A light wash that follows the theme
     (paper in the day, ink at night) so the sky brightens in both. */
  :root { --dawn: var(--paper); --dawn-strength: 46%; }
  html[data-theme="dark"] { --dawn: var(--ink); --dawn-strength: 24%; }

  .onb .sheet-body { padding-top: var(--space-6); padding-bottom: var(--space-4); justify-content: flex-start; }
  .dawn { position: absolute; inset: 0; pointer-events: none; display: none; background: radial-gradient(ellipse 85% 42% at 50% 80%, color-mix(in srgb, var(--dawn) var(--dawn-strength), transparent), transparent); }
  html[data-state="ready"] .dawn { display: block; }

  .sync { display: flex; flex-direction: column; align-items: stretch; width: 100%; }
  .sync h1 { margin-bottom: var(--space-4); }
  .sync .sub { font: var(--type-base); letter-spacing: var(--track-base); color: var(--ink-2); margin: calc(-1 * var(--space-2)) 0 var(--space-4); }

  /* a plain notice: pause or partial, never a panic colour */
  .notice { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4); border-radius: var(--radius-md); background: var(--raised); box-shadow: inset 0 0 0 var(--hairline) var(--line); font: var(--type-ui); letter-spacing: var(--track-ui); color: var(--ink); }
  .notice .ic { color: var(--dusk); margin-top: var(--space-half); }

  /* one account: address, ProgressSegments, checklist */
  .acct { padding: var(--space-3) 0; }
  .acct + .acct { box-shadow: 0 calc(-1 * var(--hairline)) 0 var(--line); }
  .acct:first-of-type { padding-top: 0; }
  .acct .top { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); font: var(--type-ui); letter-spacing: var(--track-ui); }
  .acct .top .dot { width: var(--mark-dot); height: var(--mark-dot); border-radius: 50%; flex: none; }
  .acct .top b { font-weight: 600; color: var(--ink); }
  .acct .top .st { margin-left: auto; font: var(--type-small); color: var(--dim); }
  .acct .top .btn { margin-left: auto; }
  .progress-seg > i.fail { background: var(--stamp); }
  .check { margin-top: var(--space-2); display: flex; flex-direction: column; }
  .check li { display: flex; align-items: center; gap: var(--space-2); min-height: calc(var(--space-5) + var(--space-half)); font: var(--type-ui); letter-spacing: var(--track-ui); color: var(--ink-2); }
  .check li.now { color: var(--ink); font-weight: 500; }
  .check li.pend { color: var(--dim); }
  .check li.fail { color: var(--stamp-ink); align-items: flex-start; }
  .check li.fail .mk { margin-top: var(--space-half); }
  .mk { width: var(--icon-row); height: var(--icon-row); flex: none; display: flex; align-items: center; justify-content: center; }
  .mk .ic { width: var(--icon-row); height: var(--icon-row); }
  .check li.done .mk { color: var(--hill); }
  .check li.pend .mk { color: var(--faint); }
  .check li.pause .mk { color: var(--dusk); }
  .check li.part .mk { color: var(--dim); }
  .check li.fail .mk { color: var(--stamp-ink); }
  .mk .status-track { margin: 0; width: 100%; }

  /* ready: the segments collapse into one drawn check */
  .acct.is-ready { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; }
  .acct.is-ready .top { margin: 0; flex: 1; }
  .acct.is-ready .top .st { color: var(--ink-2); }
  .acct.is-ready .ic.draw { color: var(--hill); width: var(--icon-flap); height: var(--icon-flap); stroke-width: 2px; }
  .draw path { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw var(--dur-sunrise) var(--ease-out) both; }
  @keyframes draw { from { stroke-dashoffset: 1; } }
  @media (prefers-reduced-motion: reduce) { .draw path { animation: none; } }

  .btn-filled[disabled] .kbd { background: none; color: var(--dim); box-shadow: inset 0 0 0 var(--hairline) var(--control-edge); }
  .extra { margin-top: var(--space-2); display: flex; }
  .extra .btn { margin-left: calc(-1 * var(--space-3)); }
  .opening { display: flex; align-items: center; gap: var(--space-3); font: var(--type-base); letter-spacing: var(--track-base); color: var(--ink-2); }
  .opening .status-track { width: var(--space-10); margin: 0; }
</style>
</head>
<body>
<div class="window">
  <div class="onb">
    <div class="skyscene" aria-hidden="true"></div>
    <div class="dawn sunrise" aria-hidden="true"></div>
    <span class="traffic"></span>
    <div class="drag">
      <a class="btn btn-text xs demo-btn" href="demo.html" data-tip="Load sample mail to look around. Remove it any time in Settings.">Try demo mail</a>
    </div>
    <section class="sheet dialog" aria-labelledby="h">
      <p class="sr-only" role="status" id="status"></p>
      <div class="sheet-body">
        <div class="sync" id="sync"></div>
      </div>
      <footer class="sheet-foot">
        <span class="note" id="note"></span>
        <div class="btns" id="btns"></div>
      </footer>
    </section>
  </div>
</div>
<script>
(function () {
  const html = document.documentElement;
  const $ = id => document.getElementById(id);
  const ic = Mock.icon;
  const GM = { addr: 'alex.moreno@gmail.com', color: '--tag-sky' };
  const FW = { addr: 'alex@fernworks.studio', color: '--tag-hill' };
  const BAR_LABELS = ['Connect', 'Find recent mail', 'Read your newest mail', 'Sort what matters'];

  const mark = {
    done: () => ic('check'),
    now: () => '<span class="status-track" aria-hidden="true"><i></i></span>',
    pend: () => ic('circle'),
    pause: () => ic('pause'),
    part: () => ic('clock'),
    fail: () => ic('alert'),
  };
  const li = (k, t) => `<li class="${k}"><span class="mk">${mark[k]()}</span><span>${t}</span></li>`;
  // segs: 'done' | 'now' | 'paused' | 'fail' | 'part:NN' | ''
  const seg = s => s.startsWith('part') ? `<i class="part" style="--p:${s.split(':')[1]}%"></i>` : `<i class="${s}"></i>`;
  function acct(a, { status, segs, lines, valuetext, retry }) {
    return `<div class="acct">
      <div class="top"><i class="dot" style="background:var(${a.color})"></i><b>${a.addr}</b>${retry ? `<button class="btn btn-text xs" data-retry>Try again</button>` : `<span class="st">${status}</span>`}</div>
      <div class="progress-seg" role="progressbar" aria-label="${a.addr} sync" aria-valuetext="${valuetext}">${segs.map(seg).join('')}</div>
      <ul class="check">${lines.map(l => li(l[0], l[1])).join('')}</ul>
    </div>`;
  }
  const ready = (a, text) => `<div class="acct is-ready"><svg class="ic draw" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1"/></svg><div class="top"><i class="dot" style="background:var(${a.color})"></i><b>${a.addr}</b><span class="st">${text}</span></div></div>`;
  const keysLink = `<div class="extra"><a class="btn btn-text" href="onboarding-drill.html">${ic('keyboard')}Try the keys while you wait</a></div>`;

  const btn = {
    cont: `<a class="btn btn-text" href="home.html" id="cont">Continue anyway<span class="kbd">Esc</span></a>`,
    openOff: `<button class="btn btn-filled" id="primary" disabled>Open Aplos<span class="kbd">Return</span></button>`,
    open: `<a class="btn btn-filled" href="home.html" id="primary">Open Aplos<span class="kbd">Return</span></a>`,
    now: `<a class="btn btn-filled" href="home.html" id="primary">Open now<span class="kbd">Return</span></a>`,
    toAplos: `<a class="btn btn-filled" href="home.html" id="primary">Continue to Aplos<span class="kbd">Esc</span></a>`,
  };

  const T = (t) => `<h1 class="t-display" id="h">${t}</h1>`;

  function model(state, n) {
    n = n || 24;
    const n2 = Math.min(50, Math.round(n * 1.6));
    switch (state) {
      case 'paused': return {
        title: 'Getting your mail',
        status: 'Google asked us to slow down. Resuming at 2:14 PM. Your newest mail will appear first.',
        body: `<div class="notice">${ic('pause')}<span>Google asked us to slow down. Resuming at 2:14 PM. Your newest mail will appear first.</span></div>` +
          acct(GM, { status: 'Paused until 2:14 PM', segs: ['done', 'done', 'paused', ''], valuetext: 'Paused at 24 of 50. Resuming at 2:14 PM.', lines: [['done', 'Connected'], ['done', 'Found about 214 recent emails'], ['pause', 'Reading your newest mail · paused at 24 of 50'], ['pend', 'Sort what matters']] }) +
          acct(FW, { status: 'Sorting', segs: ['done', 'done', 'done', 'part:20'], valuetext: 'Sorting what matters, 8 of 40', lines: [['done', 'Connected'], ['done', 'Found recent mail'], ['done', 'Read your newest mail · 50 of 50'], ['now', 'Sort what matters · 8 of 40']] }),
        note: 'Older mail follows once you are in.',
        btns: btn.cont + btn.open, key: 'open',
      };
      case 'ready': return {
        title: 'Your mail is ready',
        status: 'Your mail is ready. Opening Aplos.',
        body: `<p class="opening">Opening Aplos…</p><div style="margin-top:var(--space-4)">` +
          ready(GM, 'Newest 50 read · sorted 40 of 40') + ready(FW, 'Newest 50 read · sorted 20 of 20') + `</div>`,
        note: 'Aplos opens by itself when everything is in.',
        btns: btn.now, key: 'open',
      };
      case 'partial': return {
        title: 'Your newest mail is in',
        status: 'Your newest mail is in. Sorting continues in the background.',
        body: acct(GM, { status: 'Sorting continues', segs: ['done', 'done', 'done', 'part:30'], valuetext: 'Sorted 12 of 40. The rest continue in the background.', lines: [['done', 'Connected'], ['done', 'Found about 214 recent emails'], ['done', 'Read your newest mail · 50 of 50'], ['part', 'Sorted 12 of 40. The rest continue in the background.']] }) +
          acct(FW, { status: 'Ready', segs: ['done', 'done', 'done', 'done'], valuetext: 'Sorted 20 of 20', lines: [['done', 'Connected'], ['done', 'Found recent mail'], ['done', 'Read your newest mail · 50 of 50'], ['done', 'Sorted 20 of 20']] }),
        note: 'Aplos waits for you. Older mail follows after you open it.',
        btns: btn.open, key: 'open',
      };
      case 'failed': return {
        title: 'Some mail didn’t come through',
        status: 'Some mail didn’t come through.',
        body: acct(GM, { retry: true, segs: ['done', 'done', 'fail', ''], valuetext: 'Stopped while reading your newest mail', lines: [['done', 'Connected'], ['done', 'Found about 214 recent emails'], ['fail', 'Google did not answer after three tries. Your mail is safe.']] }) +
          acct(FW, { retry: true, segs: ['fail', '', '', ''], valuetext: 'Could not connect', lines: [['fail', 'Fastmail refused the app password. Replace it in Settings → Accounts.']] }),
        note: 'Nothing was lost. Aplos keeps trying in the background.',
        btns: btn.toAplos, key: 'open',
      };
      default: return {
        title: 'Getting your mail',
        status: 'Reading your newest mail.',
        body: acct(GM, { status: `Reading ${n} of 50`, segs: ['done', 'done', 'part:' + n * 2, ''], valuetext: `Reading your newest mail, ${n} of 50`, lines: [['done', 'Connected'], ['done', 'Found about 214 recent emails'], ['now', `Reading your newest mail · ${n} of 50`], ['pend', 'Sort what matters']] }) +
          acct(FW, { status: `Reading ${n2} of 50`, segs: ['done', 'done', 'part:' + n2 * 2, ''], valuetext: `Reading your newest mail, ${n2} of 50`, lines: [['done', 'Connected'], ['done', 'Found recent mail'], ['now', `Reading your newest mail · ${n2} of 50`], ['pend', 'Sort what matters']] }) + keysLink,
        note: 'Older mail follows once you are in.',
        btns: btn.cont + btn.openOff, key: 'wait',
      };
    }
  }

  let cur = null, timer;
  function render(state, n) {
    const m = model(state, n); cur = m;
    html.dataset.state = state;
    $('sync').innerHTML = T(m.title) + m.body;
    $('note').textContent = m.note;
    $('btns').innerHTML = m.btns;
    const live = $('status'); if (live.textContent !== m.status) live.textContent = m.status;
    const p = $('primary'); if (p && !p.disabled) p.focus({ preventScroll: true }); else { const c = $('cont'); if (c) c.focus({ preventScroll: true }); }
    document.querySelectorAll('[data-retry]').forEach(b => b.addEventListener('click', () => render('progress')));
  }

  const state = Mock.state || 'progress';
  addEventListener('DOMContentLoaded', () => {
    render(state);
    const flow = new URLSearchParams(location.search).has('flow') && !html.classList.contains('shot');
    if (flow && state === 'progress') {
      // Walk the whole path: the newest mail is read, then a clean finish opens Aplos by itself.
      let n = 24;
      timer = setInterval(() => {
        n = Math.min(50, n + 3);
        if (n === 50) { clearInterval(timer); render('ready'); timer = setTimeout(() => Mock.go('home.html'), 3200); return; }
        render('progress', n);
      }, 350);
    }
    if (state === 'ready' && !html.classList.contains('shot')) timer = setTimeout(() => Mock.go('home.html'), 3200);
  });

  Mock.onKey(e => {
    if (e.key === 'Escape') { Mock.go('home.html'); return true; }   // this screen owns Esc, in every state
    if (e.key === 'Enter') {
      if (e.target.closest('a, button')) return false;
      const p = $('primary'); if (p && !p.disabled) { Mock.go('home.html'); return true; }
      return true;
    }
  });
})();
</script>
</body>
</html>
