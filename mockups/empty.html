<!doctype html>
<html lang="en" data-window="main" data-states="inbox-zero,first-mail,no-accounts,drafts,trash,spam" data-esc="home.html">
<head>
<meta charset="utf-8">
<title>Empty states · Aplos mockup</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shell.css">
<script src="shell.js"></script>
<style>
  .column { padding-top: var(--space-1); }
  /* Sky moment 3 (§7.16): the drawn sky fills the workspace; text sits on the calm upper sky, ink on sky */
  .moment { position: absolute; inset: 0; }
  .moment .words { position: absolute; left: 0; right: 0; top: 36%; display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-2); padding: 0 var(--space-8); }
  .moment .t-display { color: var(--ink); }
  .moment .next { font: var(--type-base); letter-spacing: var(--track-base); color: var(--ink); }
  .moment .btn-text { margin-top: var(--space-4); color: var(--ink); }
  .moment .btn-text:hover { background: var(--hover); }
  .moment .btn-text .kbd { margin-left: var(--space-1); }
  .moment .btn-text .ic { color: var(--ink); }
  .skyscene { z-index: 0; }
  .moment .words { z-index: 1; }
  html:not([data-state="inbox-zero"]) .moment { display: none; }
  /* the sky continues behind the toolbar, so its controls step up to ink */
  html[data-state="inbox-zero"] .toolbar .btn-icon, html[data-state="inbox-zero"] .toolbar .btn-icon.labelled .ic { color: var(--ink); }
  html[data-state="inbox-zero"] .column { display: none; }
  .empty-line .row-flex { gap: var(--space-2); }
</style>
</head>
<body>
<div class="window">
  <span class="traffic"></span>
  <div class="app">
    <aside class="sidebar" id="side" data-active="home"></aside>
    <main class="main">
      <div class="moment sunrise" id="moment" role="status">
        <div class="skyscene"></div>
        <div class="words">
          <p class="t-display">You handled 12 emails.</p>
          <p class="next">Next: Design review at 2:00 PM</p>
          <button class="btn btn-text md" id="undo-last">Undo last <span class="kbd">Z</span></button>
        </div>
      </div>
      <header class="toolbar">
        <h1 class="title" id="title">Home</h1>
        <div class="tools">
          <a class="btn btn-icon" href="compose.html" data-tip="Compose" data-key="C" aria-label="Compose"><svg class="ic"><use href="#i-compose"/></svg></a>
          <a class="btn btn-icon" href="search.html" data-tip="Search" data-key="/" aria-label="Search"><svg class="ic"><use href="#i-search"/></svg></a>
          <a class="btn btn-icon labelled" href="ask.html" data-tip="Ask about your mail" data-key="A"><svg class="ic"><use href="#i-bubble"/></svg>Ask</a>
          <a class="btn btn-icon" href="ask.html?state=today" data-tip="Today" data-key="⇧A" aria-label="Today"><svg class="ic"><use href="#i-today"/></svg></a>
        </div>
      </header>
      <div class="workspace">
        <div class="column" id="col" role="list"></div>
      </div>
    </main>
  </div>
</div>
<script>
const S = Mock.state;
const side = document.getElementById('side');
const set = (k, v) => side.dataset[k] = v;
const ADD = `<svg class="ic"><use href="#i-plus"/></svg>`;
const MBOX = { drafts: ['Drafts', 'No drafts.'], trash: ['Trash', 'Trash is empty.'], spam: ['Spam', 'Spam is empty.'] };
const col = document.getElementById('col');
if (MBOX[S]) {
  // the sidebar links point here with ?state=drafts|trash|spam; the title stays, one line appears
  set('active', S); set('counts', JSON.stringify({ drafts: 0 }));
  document.getElementById('title').textContent = MBOX[S][0];
  col.innerHTML = `<div class="empty-line">${MBOX[S][1]}</div>`;
  col.setAttribute('aria-label', MBOX[S][0]);
} else if (S === 'first-mail') {
  set('status', 'firstmail'); set('counts', JSON.stringify({ home: 0, later: 0, drafts: 0 }));
  col.innerHTML = `<div class="empty-line">Your first mail is on its way.</div>`;
} else if (S === 'no-accounts') {
  set('accounts', 'none'); set('status', 'none'); set('counts', JSON.stringify({ home: 0, later: 0, drafts: 0 }));
  col.innerHTML = `<div class="empty-line">No mail yet.
    <div class="row-flex"><button class="btn btn-filled md">${ADD}Add an account</button><button class="btn btn-text md">Try demo mail</button></div></div>`;
} else {
  set('counts', JSON.stringify({ home: 0 }));
}
Mock.onKey(e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input,textarea')) return;
  if (e.key === 'z' && S === 'inbox-zero') { document.getElementById('undo-last').click(); return true; }
});
document.getElementById('undo-last').addEventListener('click', () => {
  Mock.toast({ icon: 'undo', text: 'Undone' });
  setTimeout(() => Mock.go('home.html'), 900);
});
document.querySelector('.empty-line .btn-filled')?.addEventListener('click', () => Mock.go('onboarding-welcome.html'));
document.querySelector('.empty-line .btn-text')?.addEventListener('click', () => Mock.go('demo.html'));
</script>
</body>
</html>
