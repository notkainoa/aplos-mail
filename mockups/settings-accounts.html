<!doctype html>
<html lang="en" data-window="main" data-states="default,reconnect" data-esc="home.html">
<head>
<meta charset="utf-8">
<title>Settings, Accounts · Aplos mockup</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="settings.css">
<script src="shell.js"></script>
<script src="settings.js"></script>
</head>
<body>
<div class="window">
  <span class="traffic"></span>
  <div class="app">
    <aside class="sidebar" id="sb" data-active="none" data-accounts="all"></aside>
    <main class="main">
      <header class="toolbar">
        <h1 class="title">Settings</h1>
        <div class="tools">
          <a class="btn btn-icon" href="compose.html" data-tip="Compose" data-key="C" aria-label="Compose"><svg class="ic"><use href="#i-compose"/></svg></a>
          <a class="btn btn-icon" href="search.html" data-tip="Search" data-key="/" aria-label="Search"><svg class="ic"><use href="#i-search"/></svg></a>
          <a class="btn btn-icon labelled" href="ask.html" data-tip="Ask about your mail" data-key="A"><svg class="ic"><use href="#i-bubble"/></svg>Ask</a>
          <a class="btn btn-icon" href="ask.html?state=today" data-tip="Today" data-key="⇧A" aria-label="Today"><svg class="ic"><use href="#i-today"/></svg></a>
        </div>
      </header>
      <div class="workspace set-ws">
        <div class="settings">
          <nav class="nav snav" id="snav"></nav>
          <div class="scontent" id="content"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script>
S.nav('Accounts');
const reconnect = Mock.state === 'reconnect';
document.getElementById('sb').dataset.status = reconnect ? 'reconnect' : 'synced';
const ic = Mock.icon;
const SW = [['sky', '--tag-sky', 'Sky'], ['hill', '--tag-hill', 'Hill'], ['stamp', '--tag-stamp', 'Stamp'], ['dusk', '--tag-dusk', 'Dusk'], ['sand', '--tag-sand', 'Sand'], ['ember', '--tag-ember', 'Ember']];
const swatches = (id, cur) => `<div class="swatches" role="radiogroup" aria-label="Colour">${SW.map(([k, v, n]) => `<button class="swatch" role="radio" aria-checked="${k === cur}" aria-label="${n}" data-swatch="${id}:${k}" style="--c:var(${v})">${ic('check')}</button>`).join('')}</div>`;
const ACCTS = [
  { id: 'g', name: 'alex.moreno@gmail.com', prov: 'Google', mark: '--tag-sky', col: 'sky', ai: true, bad: reconnect },
  { id: 'f', name: 'alex@fernworks.studio', prov: 'Fastmail · IMAP', mark: '--tag-hill', col: 'hill', ai: false },
];
const acct = a => `<div class="block">
  <div class="srow">
    <div><div class="l acct-name"><span class="mk" style="background:var(${a.mark})"></span><b>${a.name}</b><span class="prov">${a.prov}</span></div>
      <div class="h ${a.bad ? 'bad' : 'ok'}">${a.bad ? ic('alert') + 'Google needs you to sign in again.' : ic('check') + 'Connected · synced 2 min ago'}</div></div>
    <div class="c">${a.bad ? `<button class="btn btn-filled md">Reconnect</button>` : `<button class="btn btn-text md">Remove</button>`}</div>
  </div>
  ${S.row({ label: 'Use this account’s mail for AI', hint: 'Lets Ask, summaries and drafts read this mailbox. Off means nothing from it is sent.', control: S.sw('ai-' + a.id, a.ai, 'Use this account’s mail for AI') })}
  ${S.row({ label: 'Colour', hint: 'The dot beside this account’s mail and events.', control: swatches(a.id, a.col) })}
</div>`;
document.getElementById('content').innerHTML =
  S.group('Accounts', ACCTS.map(acct).join('') +
    `<div class="srow"><div class="h">Google, iCloud, Fastmail or any other IMAP mailbox.</div><div class="c"><button class="btn btn-text md">${ic('plus')}Add account</button></div></div>`) +
  S.group('Demo mail', S.row({ label: 'Demo mail', hint: 'Sample mail and events for trying Aplos. Nothing here is real.', control: `<button class="btn btn-text md" data-demo="load">Load</button><button class="btn btn-text md" data-demo="reset">Reset</button><button class="btn btn-text md" data-demo="remove">Remove</button>` }));
document.addEventListener('click', e => {
  const s = e.target.closest('[data-swatch]');
  if (s) { const g = s.closest('.swatches'); g.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-checked', String(x === s))); const [id, k] = s.dataset.swatch.split(':'); const mk = g.closest('.block').querySelector('.acct-name .mk'); mk.style.background = `var(--tag-${k})`; return; }
  const d = e.target.closest('[data-demo]');
  if (d) Mock.toast({ icon: 'check', text: { load: 'Demo mail loaded', reset: 'Demo mail reset', remove: 'Demo mail removed' }[d.dataset.demo], actions: d.dataset.demo === 'remove' ? [['Undo', 'Z']] : [] });
  if (e.target.closest('.btn-filled')) Mock.toast({ icon: 'refresh', text: 'Opening Google sign-in' });
});

</script>
</body>
</html>
