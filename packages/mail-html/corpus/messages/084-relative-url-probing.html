<p>Notes on relative addresses.</p>
<img src="img/0" alt="guess an image index">
<img src="img/999999" alt="out of range index">
<img src="cid/0" alt="guess a cid index">
<img src="cid/../../etc/passwd" alt="traversal in cid">
<img src="../0123456789abcdef/img/0" alt="another token via dot dot">
<img src="/m/0123456789abcdef/img/0" alt="another token via absolute path">

<img src="//{{CANARY_HOST}}/protocol-relative-image.png" alt="protocol relative host">
<img src="aplos-mail://m/0123456789abcdef/img/0" alt="absolute other token">

<img src="aplos-mail:///img/0" alt="empty host">
<img src="?x=1" alt="query only">
<img src="#fragment" alt="fragment only">
<img src="" alt="empty source">
<img src="." alt="dot">
<img src=".." alt="dot dot">
<img src="%2e%2e/%2e%2e/img/0" alt="encoded traversal">

<img src="img//0" alt="double slash">
<img src="img/0/extra" alt="extra path segment">
<img src="img/0?cache=1#x" alt="query on a real path">
<img src="img/-1" alt="negative index">
<img src="img/1e3" alt="exponent index">
