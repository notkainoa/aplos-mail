<html amp4email data-css-strict>
<head><meta charset="utf-8">
<script async src="{{CANARY}}/{{ID}}/amp-runtime.js"></script>
<script async custom-element="amp-list" src="{{CANARY}}/{{ID}}/amp-list.js"></script>
<style amp4email-boilerplate>body{visibility:hidden}</style>
</head>
<body>
<p>Interactive newsletter with live content.</p>
<amp-img src="{{CANARY}}/{{ID}}/amp-img.jpg" width="300" height="200" layout="responsive" alt="amp image"></amp-img>
<amp-pixel src="{{CANARY}}/{{ID}}/amp-pixel?r=RANDOM"></amp-pixel>
<amp-list src="{{CANARY}}/{{ID}}/amp-list.json" width="300" height="100"><template type="amp-mustache"><div>{{name}}</div></template></amp-list>
<amp-form action-xhr="{{CANARY}}/{{ID}}/amp-form-xhr" method="post"><input name="x"><input type="submit"></amp-form>
<amp-iframe src="{{CANARY}}/{{ID}}/amp-iframe" width="100" height="100"></amp-iframe>
<amp-analytics type="googleanalytics"><script type="application/json">{"requests":{"pageview":"{{CANARY}}/{{ID}}/amp-analytics?x=1"},"triggers":{"t":{"on":"visible","request":"pageview"}}}</script></amp-analytics>
<amp-video src="{{CANARY}}/{{ID}}/amp-video.mp4" width="300" height="200"></amp-video>
<x-img src="{{CANARY}}/{{ID}}/x-img" data-src="{{CANARY}}/{{ID}}/x-img-data-src"></x-img>
<custom-widget href="{{CANARY}}/{{ID}}/custom-href" src="{{CANARY}}/{{ID}}/custom-src" style="background:url({{CANARY}}/{{ID}}/custom-style)">custom element</custom-widget>
<x-apple-data-detectors><a href="{{CANARY}}/{{ID}}/apple-detectors">apple detectors</a></x-apple-data-detectors>
<link-preview url="{{CANARY}}/{{ID}}/link-preview"></link-preview>
<o:p src="{{CANARY}}/{{ID}}/office-p"></o:p><v:image src="{{CANARY}}/{{ID}}/vml-image" xmlns:v="urn:schemas-microsoft-com:vml"></v:image>
</body></html>
