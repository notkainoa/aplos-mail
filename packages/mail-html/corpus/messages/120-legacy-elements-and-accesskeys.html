<p>Notice board from a very old web page.</p>
<layer src="{{CANARY}}/{{ID}}/layer-src"></layer>
<ilayer src="{{CANARY}}/{{ID}}/ilayer-src"></ilayer>
<basefont face="{{CANARY}}/{{ID}}/basefont-face" size="3">
<blink>blinking text</blink><comment><img src="{{CANARY}}/{{ID}}/comment-element"></comment>
<keygen name="k" challenge="x"><menuitem label="x" icon="{{CANARY}}/{{ID}}/menuitem-icon"></menuitem>
<command icon="{{CANARY}}/{{ID}}/command-icon" label="x"><menu type="context" id="m"><menuitem label="x" onclick="fetch('{{CANARY}}/{{ID}}/menuitem-click')"></menuitem></menu>
<div contextmenu="m" contenteditable="true" spellcheck="true" draggable="true" ondragstart="fetch('{{CANARY}}/{{ID}}/dragstart')" oncopy="fetch('{{CANARY}}/{{ID}}/oncopy')" onpaste="fetch('{{CANARY}}/{{ID}}/onpaste')">editable and draggable</div>
<a href="{{CANARY}}/{{ID}}/accesskey-j" accesskey="j" target="_blank">accesskey j</a>
<button accesskey="e" onclick="fetch('{{CANARY}}/{{ID}}/accesskey-button')">accesskey e</button>
<input accesskey="r" onfocus="fetch('{{CANARY}}/{{ID}}/accesskey-input')">
<a xlink:href="javascript:fetch('{{CANARY}}/{{ID}}/html-xlink-href')" href="#">xlink on an html anchor</a>
<canvas width="10" height="10"><img src="{{CANARY}}/{{ID}}/canvas-fallback"></canvas>
<table dynsrc="{{CANARY}}/{{ID}}/table-dynsrc" lowsrc="{{CANARY}}/{{ID}}/table-lowsrc"><tr><td background="{{CANARY}}/{{ID}}/legacy-td-bg">x</td></tr></table>
<?import namespace="v" implementation="#default#VML">
<xml id="data-island"><root><item src="{{CANARY}}/{{ID}}/xml-island-item"/></root></xml>
<span datafld="x" datasrc="{{CANARY}}/{{ID}}/datasrc"></span>
<div style="behavior:url(#default#userData)">userdata</div>
<listing>listing</listing><dir><li>dir item</li></dir><center>centered</center><nobr>no break</nobr><spacer type="block" width="10"><multicol cols="2">columns</multicol>
<img src="{{CANARY}}/{{ID}}/ismap.png" ismap alt=""><input type="image" src="{{CANARY}}/{{ID}}/input-image-legacy.png" alt="">
