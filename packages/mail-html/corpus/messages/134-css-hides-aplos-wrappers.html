<style>
  details.aplos-quote, ./**/aplos-quote, details.APLOS-quote { display: none }
  [class^=aplos-], [class*=aplos-], [class|=aplos], [class$="aplos-quote"] { display: none }
  [class~="aplos-quote"], [class=aplos-quote i], [CLASS='aplos-clipped'] { display: none }
  :is(.aplos-quote, ;) { display: none }
  :where(.aplos-quote, }) { display: none }
  :not(.keep) .aplos-find, :has(> .aplos-blocked) { display: none }
  #aplos-quote, [id^=aplos-] { display: none }
</style>
