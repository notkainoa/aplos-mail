<style>
  @layer aplos-reading { html:root { position: absolute !important; top: 0; bottom: -50px; height: calc(100% + 50px) !important } }
  @layer \61 plos-reading { html:root>body { position: fixed !important; inset: 0 0 -50px !important } }
  @layer APLOS-reading.deeper { html { writing-mode: vertical-lr !important; margin-bottom: -50px } }
  @layer first, aplos-reading;
  @layer aplos-reading /* a comment */ { html:root { min-height: calc(100% + 50px) !important } }
